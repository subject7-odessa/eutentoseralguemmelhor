<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo Sombrio</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#14110f;--p:#1d1915;--p2:#26211c;--ln:#3a322a;--tx:#efe9db;--mu:#9b9080;--rd:#b3261e;--rd2:#7a1812;--ok:#7fa36b;--ye:#e0b84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Libre Baskerville',Georgia,serif}
.mono,label,th,nav a,button,.tag{font-family:'Special Elite','Courier New',monospace}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;background:#0c0a09;border-bottom:2px solid var(--rd2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.12em;line-height:1}.logo small{display:block;font:11px 'Special Elite';color:var(--rd);letter-spacing:.2em}
nav{display:flex;gap:6px;margin:0 auto}
nav a{color:var(--mu);padding:6px 14px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
nav a.on{color:var(--tx);border-color:var(--rd)}
.stamp{border:2px solid var(--rd);color:var(--rd);padding:1px 8px;transform:rotate(-4deg);font:12px 'Special Elite';letter-spacing:.2em}
main{max-width:1100px;margin:0 auto;padding:24px}
h2{font-size:22px;margin:0 0 4px}h3{font:13px 'Special Elite';letter-spacing:.18em;color:var(--rd);text-transform:uppercase;margin:0 0 8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--rd)}button.pr{background:var(--rd2);border-color:var(--rd)}button.x{color:var(--rd);background:none;border:none;padding:2px 6px}
input,select,textarea{background:#0f0d0b;color:var(--tx);border:1px solid var(--ln);padding:5px 8px;font:inherit;font-size:14px;width:100%}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.card{background:var(--p);border:1px solid var(--ln);border-left:3px solid var(--rd2);padding:14px}
.mu{color:var(--mu);font-size:12px}
.auth{max-width:380px;margin:60px auto}.auth input{margin-bottom:10px}
.sheet{display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:860px){.sheet{grid-template-columns:1fr}}
.ro{pointer-events:none;opacity:.8}
.box{background:var(--p);border:1px solid var(--ln);padding:14px;margin-bottom:16px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.at{background:var(--p2);border:1px solid var(--ln);padding:8px;text-align:center}
.at b{display:block;font-size:11px;font-weight:400;color:var(--mu);letter-spacing:.14em;font-family:'Special Elite'}
.at .n{font-size:28px;line-height:1.1}.at .v{font:12px 'Special Elite';color:var(--rd)}
.st{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:4px}.st button{padding:0 8px}
.ex{display:flex;gap:4px;align-items:center;justify-content:center;margin-top:6px;font:11px 'Special Elite';color:var(--mu)}.ex input{width:48px;padding:1px 4px;text-align:center}
.der{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.der div{background:var(--p2);padding:8px;border:1px solid var(--ln)}.der .n{font-size:22px}
.bar{height:10px;background:#0f0d0b;border:1px solid var(--ln);margin:6px 0}.bar i{display:block;height:100%;background:var(--rd)}
table{width:100%;border-collapse:collapse}th{font-weight:400;color:var(--mu);font-size:11px;letter-spacing:.14em;text-align:left;padding:4px}
td{padding:3px 4px;border-top:1px solid var(--ln)}td input,td select{padding:2px 4px;font-size:13px}
td.val{font-size:18px;text-align:center;width:56px}
.d{width:32px;height:28px;padding:0;font-size:15px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20;width:300px;max-width:calc(100vw - 32px)}
.toast{background:#0c0a09;border:1px solid var(--ln);border-left:4px solid var(--mu);padding:10px 12px;box-shadow:0 2px 8px #0008;animation:in .25s}
.toast.s{border-left-color:var(--ok)}.toast.f{border-left-color:var(--rd)}.toast.e{border-left-color:var(--ye)}
.toast .big{font-size:24px;line-height:1.1}.toast .res{font:12px 'Special Elite';letter-spacing:.14em;text-transform:uppercase}
@keyframes in{from{transform:translateX(30px);opacity:0}}
#logbtn{position:fixed;left:16px;bottom:16px;z-index:20}
#log{position:fixed;left:0;top:0;bottom:0;width:360px;max-width:100vw;background:#0c0a09;border-right:2px solid var(--rd2);z-index:30;padding:16px;overflow:auto;transform:translateX(-105%);transition:.2s}
#log.on{transform:none}#log p{margin:0;border-bottom:1px solid var(--ln);padding:7px 0;font-size:13px}
.s{color:var(--ok)}.f{color:var(--rd)}.e{color:var(--ye)}
.mod{width:80px}.err{color:var(--rd);font-size:13px;min-height:20px}

.steps{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}.steps a{cursor:pointer;color:var(--tx);font:15px 'Special Elite';letter-spacing:.06em}.steps a.on{color:var(--rd)}.steps i{width:50px;height:1px;background:var(--mu)}
.wz{max-width:860px;margin:0 auto}.wz label,.sheet label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px;letter-spacing:.1em}
.xc{background:var(--p2);border:1px solid var(--ln);margin-bottom:8px}.xc>summary{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none}.xc>summary::before{content:'▾';color:var(--rd)}.xc[open]>summary{border-bottom:1px solid var(--rd2)}.xb{padding:12px}
.rd{color:var(--rd)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex!important;gap:6px;align-items:center;margin:0!important;color:var(--tx)!important;font-size:13px!important}.chip input{width:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--ln)}.tabs a{padding:6px 12px;cursor:pointer;color:var(--mu);font:13px 'Special Elite';letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent}.tabs a.on{color:var(--tx);border-color:var(--rd)}
.cc{min-height:150px;background:linear-gradient(180deg,#0c0a09 0,var(--p) 80%)}button:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}.modal .card{width:340px;max-width:90vw}
.modal .mbox{width:760px;max-width:95vw;max-height:88vh;overflow:auto}.modal .xc>summary{align-items:center}
</style></head><body>
<header>
 <div class="logo">ARQUIVO SOMBRIO<small>SISTEMA DE INVESTIGAÇÃO</small></div>
 <nav id="nav"></nav><span class="stamp">CONFIDENCIAL</span><button id="out" style="display:none">Sair</button>
</header>
<main id="app"></main>
<button id="logbtn" class="pr" style="display:none">Log de dados</button>
<aside id="log"><div class="row"><h3 class="sp">Log de dados</h3><button class="x" id="logx">✕</button></div><div id="logl"></div></aside>
<div id="toasts"></div>
<script src="catalogo.js"></script>
<script>
/* ====== CONFIGURAÇÃO: cole os dados do seu projeto Supabase ====== */
const SUPABASE_URL='https://hylwmeyaffacifgopyhm.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5bHdtZXlhZmZhY2lmZ29weWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODE3OTMsImV4cCI6MjEwNzI1Nzc5M30.at8wuv_5hOUztpn4mwB1WdijExpWISLNFOXr6CjP0ws';
/* ================================================================= */

const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ATT=[['FOR','Força'],['COO','Coordenação'],['RES','Resistência'],['RAC','Raciocínio'],['PER','Percepção'],['CON','Controle']];
const SK=[['Armas de Fogo','COO'],['Corpo a Corpo','COO'],['Defesa','COO'],['Tática','RAC'],['Investigação','RAC'],['Observação','PER'],['Perícia Forense','RAC'],['Pesquisa','RAC'],['Ocultismo','RAC'],['Religião','RAC'],['Medicina','RAC'],['Mecânica','RAC'],['Eletrônica','RAC'],['Computação','RAC'],['Direção','COO'],['Sobrevivência','PER'],['Furtividade','COO'],['Persuasão','RAC'],['Intimidação','CON'],['Enganação','CON'],['Empatia','PER']];

if(SUPABASE_URL.startsWith('COLE')){document.body.innerHTML='<main><h2>Falta configurar</h2><p>Abra o <b>index.html</b> e cole a Project URL e a anon key do Supabase no topo do script (veja o LEIA-ME).</p></main>';throw 0}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ---------- estado ---------- */
let user=null,prof=null,camps=[],camp=null,chars=[],threats=[],rolls=[],names={},chan=null;
let view='agentes',open=null,mod=0,timers={};
const isMaster=()=>camp&&camp.master===user.id;
const canEdit=c=>c.owner===user.id||isMaster();
const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
function ask(msg){return new Promise(res=>{const o=document.createElement('div');o.className='modal';o.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="row"><span class="sp"></span><button data-k="0">Cancelar</button><button class="pr" data-k="1">Confirmar</button></div></div>`;o.onclick=e=>{const k=e.target.dataset.k;if(k!=null){o.remove();res(k==='1')}};document.body.append(o)})}
async function delRow(t,id){const {data,error}=await sb.from(t).delete().eq('id',id).select();
 if(error){alert('Erro ao excluir: '+error.message);return false}
 if(!data||!data.length){alert('Nada foi excluído: só o dono da ficha ou o mestre da campanha pode excluir.');return false}
 return true}

/* ---------- regras ---------- */
const tot=(c,k)=>(+c.attrs[k]||0)+(+c.extra?.[k]||0);
const sval=(c,s)=>tot(c,s.attr)*5+(+s.pts||0);
const calc=c=>{const r={};ATT.forEach(([k])=>r[k]=tot(c,k)*5);r.vida=10+2*tot(c,'RES');r.defv=tot(c,'COO')*5+(+c.defPts||0);r.defp=25+Math.floor(r.defv/2);r.ini=tot(c,'COO')*5;return r};
const newData=()=>({player:prof.name,prof:'',attrs:{FOR:2,COO:2,RES:2,RAC:2,PER:2,CON:2},extra:{},defPts:0,vidaAtual:14,pressao:0,skills:SK.map(([n,a])=>({n,attr:a,pts:0})),weapons:[],notes:''});
const toChar=r=>({...r.data,id:r.id,owner:r.owner,name:r.name,created:r.created_at||r.updated_at});
const grade=(r,t)=>r>=96?['Falha crítica*','f']:r<=5?['Sucesso excepcional','e']:r<=t?['Sucesso','s']:['Falha','f'];
const d100=()=>1+Math.floor(Math.random()*100);
const TIER={leve:'1d6',moderado:'1d10',pesado:'2d10',devastador:'3d10',catastrofico:'4d10'};
function dmg(x){x=String(x||'').replace(/\s/g,'');const tn=x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(TIER[tn])x=TIER[tn];let m=x.match(/^(\d*)d(\d+)([+-]\d+)?$/i);
 if(m){let n=+m[1]||1,s=+m[3]||0;for(let i=0;i<n;i++)s+=1+Math.floor(Math.random()*+m[2]);return Math.max(0,s)}
 return /^\d+$/.test(x)?+x:null}

/* ---------- dados ---------- */
async function post(c,label,data){
 const {error}=await sb.from('rolls').insert({campaign_id:camp.id,user_id:user.id,who:c.name,label,data});
 if(error)alert('Erro ao rolar: '+error.message)}
function test(t){const T=Math.max(5,Math.min(95,t+mod)),r=d100(),[res,cls]=grade(r,T);return{target:T,mod,roll:r,res,cls}}
const rollSkill=(c,label,t)=>post(c,label,test(t));
function rollWeapon(c,w,onlyDmg){
 if(onlyDmg){const d=dmg(w.dmg);return post(c,w.name+' (dano)',{kind:'dmg',dmg:d,expr:w.dmg,cls:'',res:''})}
 const s=c.skills.find(x=>x.n===w.skill),t=s?sval(c,s):tot(c,'COO')*5,o=test(t);
 o.kind='atk';o.expr=w.dmg;o.dmg=(o.cls==='s'||o.cls==='e')?dmg(w.dmg):null;post(c,w.name,o)}
function toast(o){const d=o.data||{},el=document.createElement('div');el.className='toast '+(d.cls||'');
 const head=`<div class="mu mono">${esc(o.who)} · ${esc(o.label)}${d.target?` (alvo ${d.target}${d.mod?`, mod ${d.mod>0?'+':''}${d.mod}`:''})`:''}</div>`;
 el.innerHTML=d.kind==='atk'?head+`<div class="big">ataque=${d.roll} / dano=${d.dmg??'—'}</div><span class="res ${d.cls}">${d.res}${d.dmg==null?'':' · '+esc(d.expr)}</span>`
  :d.kind==='dmg'?head+`<div class="big">dano=${d.dmg??'?'}</div><span class="res mu">${esc(d.expr)}</span>`
  :head+`<div class="row"><span class="big">${d.roll}</span><span class="res ${d.cls}">${d.res}</span></div>`;
 $('#toasts').append(el);setTimeout(()=>el.remove(),8000)}
function logLine(o){const d=o.data||{},t=new Date(o.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 const r=d.kind==='atk'?`ataque=${d.roll} / dano=${d.dmg??'—'} <span class="${d.cls}">${d.res}</span>`:d.kind==='dmg'?`dano=${d.dmg??'?'}`:`${d.roll} <span class="${d.cls}">${d.res}</span>`;
 return `<p><span class="mu mono">${t}</span> <b>${esc(o.who)}</b> · ${esc(o.label)}${d.target?` (${d.target})`:''} → ${r}</p>`}
const renderLog=()=>$('#logl').innerHTML=rolls.map(logLine).join('')||'<p class="mu">Nenhuma rolagem ainda.</p>';
$('#logbtn').onclick=()=>$('#log').classList.add('on');$('#logx').onclick=()=>$('#log').classList.remove('on');

/* ---------- salvar ---------- */
function save(c){clearTimeout(timers[c.id]);timers[c.id]=setTimeout(async()=>{
 const {id,owner,name,...data}=c;
 const {error}=await sb.from('characters').update({name,data,updated_at:new Date().toISOString()}).eq('id',id);
 if(error)alert('Erro ao salvar: '+error.message);delete timers[c.id]},350)}

/* ---------- telas ---------- */
function go(v,id){view=v;open=id||null;render()}
function render(){
 const app=$('#app'),nav=$('#nav');app.onclick=app.onchange=app.oninput=null;
 $('#out').style.display=user?'':'none';$('#logbtn').style.display=camp?'':'none';
 if(!user)return authView(app,nav);
 if(!camp)return campsView(app,nav);
 nav.innerHTML=[['agentes','Agentes'],['ameacas','Ameaças',1],['mesa','Mesa']].filter(x=>!x[2]||isMaster()).map(([v,t])=>`<a data-v="${v}" class="${view===v||(v==='agentes'&&view==='novo')?'on':''}">${t}</a>`).join('');
 nav.onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};
 if(view==='novo')return wizard(app);
 if(view==='agentes')return open?sheet(app):agentes(app);
 if(view==='ameacas')return threatsView(app);
 mesa(app)}
function authView(app,nav){nav.innerHTML='';let mode='in';
 const draw=()=>{app.innerHTML=`<div class="auth card"><h2>${mode==='in'?'Entrar':'Criar conta'}</h2><br>
  ${mode==='up'?'<input id="nm" placeholder="Seu nome de jogador">':''}<input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha (mín. 6)">
  <div class="err" id="er"></div><div class="row"><button class="pr" id="go">${mode==='in'?'Entrar':'Cadastrar'}</button><button id="sw">${mode==='in'?'Criar conta':'Já tenho conta'}</button></div></div>`;
  $('#sw').onclick=()=>{mode=mode==='in'?'up':'in';draw()};
  $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;let r;
   if(mode==='in')r=await sb.auth.signInWithPassword({email:em,password:pw});
   else r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('#nm').value.trim()}}});
   if(r.error)$('#er').textContent=r.error.message;
   else if(mode==='up'&&!r.data.session)$('#er').textContent='Conta criada. Confirme o e-mail (se o Supabase pedir) e entre.'}};
 draw()}
async function campsView(app,nav){nav.innerHTML='';
 const {data}=await sb.from('campaigns').select('*').order('created_at');camps=data||[];
 const ids=camps.map(c=>c.id),mm=ids.length?((await sb.from('members').select('campaign_id').in('campaign_id',ids)).data||[]):[],cnt={};
 mm.forEach(m=>cnt[m.campaign_id]=(cnt[m.campaign_id]||0)+1);
 app.innerHTML=`<div class="row"><h2 class="sp">Campanhas: ${camps.length}</h2></div><div class="grid">${camps.map(c=>`<div class="card cc"><div class="mu">👥 ${cnt[c.id]||1} participante(s)</div><h2 style="font-size:20px;margin:36px 0 2px">${esc(c.name)}</h2><div class="mu">Iniciada em ${fmt(c.created_at)} | ${c.master===user.id?'Mestre · código <b>'+c.code+'</b>':'Jogador'}</div><div class="row" style="margin-top:10px"><button class="pr" data-e="${c.id}">Acessar</button><span class="sp"></span>${c.master===user.id?`<button class="x" data-dc="${c.id}" title="Excluir campanha">✕</button>`:''}</div></div>`).join('')||'<p class="mu">Você ainda não está em nenhuma campanha.</p>'}</div><br>
 <div class="row"><div class="card sp"><h3>Nova campanha (você será o mestre)</h3><div class="row"><input id="cn" placeholder="Nome da campanha" style="flex:1"><button class="pr" id="cc">Criar</button></div></div>
 <div class="card sp"><h3>Entrar com código</h3><div class="row"><input id="jc" placeholder="Código de 6 letras" style="flex:1"><button id="jj">Entrar</button></div></div></div>`;
 app.onclick=async e=>{const d=e.target.dataset;if(d.e)enter(d.e);if(d.dc&&await ask('Excluir a campanha e TODAS as fichas dela? Isso não pode ser desfeito.')){if(await delRow('campaigns',d.dc))campsView(app,nav)}};
 $('#cc').onclick=async()=>{const n=$('#cn').value.trim();if(!n)return alert('Dê um nome à campanha.');const r=await sb.rpc('create_campaign',{p_name:n});r.error?alert(r.error.message):enter(r.data)};
 $('#jj').onclick=async()=>{const r=await sb.rpc('join_campaign',{p_code:$('#jc').value});r.error?alert(r.error.message):enter(r.data)}}
async function enter(id){
 const {data}=await sb.from('campaigns').select('*').eq('id',id).single();camp=data;view='agentes';open=null;
 const [c,t,r,m]=await Promise.all([sb.from('characters').select('*').eq('campaign_id',id).order('name'),
  isMaster()?sb.from('threats').select('*').eq('campaign_id',id):{data:[]},
  sb.from('rolls').select('*').eq('campaign_id',id).order('created_at',{ascending:false}).limit(100),
  sb.from('members').select('user_id').eq('campaign_id',id)]);
 chars=(c.data||[]).map(toChar);threats=t.data||[];rolls=r.data||[];
 const ids=(m.data||[]).map(x=>x.user_id);const p=await sb.from('profiles').select('*').in('id',ids);names={};(p.data||[]).forEach(x=>names[x.id]=x.name);
 renderLog();
 chan&&sb.removeChannel(chan);
 chan=sb.channel('camp-'+id)
  .on('postgres_changes',{event:'*',schema:'public',table:'characters',filter:'campaign_id=eq.'+id},p=>{
   if(p.eventType==='DELETE')chars=chars.filter(x=>x.id!==p.old.id);
   else{const c=toChar(p.new),i=chars.findIndex(x=>x.id===c.id);if(timers[c.id])return;i<0?chars.push(c):chars[i]=c}
   if(!typing()||(view==='agentes'&&!open))render()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'rolls',filter:'campaign_id=eq.'+id},p=>{rolls.unshift(p.new);renderLog();toast(p.new)})
  .on('postgres_changes',{event:'*',schema:'public',table:'threats',filter:'campaign_id=eq.'+id},p=>{
   if(p.eventType==='DELETE')threats=threats.filter(x=>x.id!==p.old.id);else{const i=threats.findIndex(x=>x.id===p.new.id);i<0?threats.push(p.new):threats[i]=p.new}
   if(!typing())render()})
  .subscribe();
 render()}
function mesa(app){app.innerHTML=`<h2>${esc(camp.name)}</h2><div class="mu">${isMaster()?'Código para convidar jogadores: <b>'+camp.code+'</b>':'Mestre: '+esc(names[camp.master]||'?')}</div><br>
 <div class="box"><h3>Jogadores</h3>${Object.values(names).map(esc).join(' · ')}</div>
 <button id="lv">← Trocar de campanha</button>`;
 $('#lv').onclick=()=>{camp=null;sb.removeChannel(chan);render()}}
/* ---------- dados do livro (Cap. 2: Criação do Investigador) ---------- */
const ESP=[{"n":"Investigador Particular","f":["Investigação","Observação","Pesquisa","Furtividade","Persuasão","Direção"],"v":"Linha Aberta. Uma vez por caso, antes de uma cena de investigação, o jogador declara uma linha de apuração que o personagem já havia começado, como um endereço verificado, um nome pesquisado ou uma testemunha sondada, e o Mestre fornece uma pequena pista, nunca a solução. Em vigilância planejada, o personagem recebe mais dez em Observação e Furtividade.","l":"não possui autoridade legal. Abordagens a funcionários que exigem credencial sofrem menos dez, e sua atividade pode ser denunciada","e":"câmera com lente de alcance, gravador, binóculos, bloco, ferramentas simples de acesso","c":"um funcionário público de baixo escalão ou um informante local","r":"Estáveis"},{"n":"Perito Criminal","f":["Perícia Forense","Investigação","Observação","Medicina","Pesquisa","Computação"],"v":"Cadeia de Evidência. Quando documenta corretamente uma pista, em uma cena que preservou, a evidência não pode ser invalidada por falha técnica, e o personagem recebe mais dez em Perícia Forense sobre ela.","l":"laboratório oficial leva dias, a instituição pode interferir e qualquer evidência retirada da cena sem registro perde o valor de prova","e":"kit de coleta, luvas, lanterna forense, câmera, sacos de evidência","c":"um técnico de laboratório","r":"Estáveis"},{"n":"Policial","f":["Armas de Fogo","Corpo a Corpo","Defesa","Direção","Intimidação","Investigação"],"v":"Autoridade Real. Dentro da jurisdição e com motivo legítimo, o personagem pode exigir cooperação de civis, com mais dez em Persuasão ou Intimidação quando o distintivo importa, acessar registros policiais comuns sem teste e isolar uma cena por um período razoável.","l":"suas ações oficiais deixam registro. Cada uso da autoridade fora do procedimento acumula um ponto de Atenção, nos termos da Parte III (Capítulo 12 )","e":"arma de serviço, algemas, rádio, colete leve, distintivo","c":"um colega de delegacia","r":"Estáveis"},{"n":"Médico","f":["Medicina","Pesquisa","Perícia Forense","Empatia","Observação","Persuasão"],"v":"Prioridade Clínica. Reconhece sem teste situações clínicas comuns fora de pressão. Sob pressão, recebe mais dez em Medicina para estabilizar. Pode solicitar exames e leito hospitalar em até um dia, desde que não precise ocultar o caso.","l":"responsabilidade profissional. Sigilo, licença e prontuário regem suas ações, abandonar um paciente tem consequência e o uso de medicamentos controlados deixa registro","e":"maleta médica avançada, estetoscópio, material de sutura, medicamentos comuns","c":"um colega de hospital","r":"Estáveis ou Confortáveis"},{"n":"Paramédico","f":["Medicina","Direção","Defesa","Observação","Empatia","Sobrevivência"],"v":"Hora de Ouro. Nos primeiros dez minutos depois de um ferimento, recebe mais dez em Medicina e ignora a penalidade por falta de kit. Pode estabilizar um personagem Morrendo mesmo em movimento, com a penalidade normal para pacientes sob ameaça.","l":"age por protocolo. Diagnósticos complexos e procedimentos avançados exigem equipamento que ele raramente carrega, e o Mestre pode negá-los","e":"bolsa de emergência, oxigênio portátil, talas, maca dobrável","c":"um motorista ou um regulador de central","r":"Estáveis"},{"n":"Jornalista","f":["Pesquisa","Persuasão","Enganação","Investigação","Computação","Observação"],"v":"Fonte Cruzada. Quando duas fontes independentes contradizem uma terceira, o personagem identifica sem teste qual ponto merece investigação adicional, desde que tenha acesso aos materiais. Com credencial de imprensa, recebe mais dez em Persuasão para entrevistas.","l":"visibilidade. É reconhecível, sua presença alerta quem tem algo a esconder, e a pressão do prazo de uma redação pode ser usada contra ele","e":"celular com gravador, câmera, notebook, credencial","c":"um editor ou uma fonte em órgão público","r":"Limitados ou Estáveis"},{"n":"Pesquisador Acadêmico","f":["Pesquisa","Ocultismo","Religião","Investigação","Computação","Observação"],"v":"Acesso Acadêmico. Possui Fonte Cruzada, como o jornalista, e recebe mais dez em Pesquisa em acervos institucionais e universitários. Possui um conhecimento especializado adicional na área de sua formação.","l":"a credibilidade profissional depende de método. Afirmar em público o que não pode demonstrar custa reputação, e prazos acadêmicos competem com os do caso","e":"notebook, livros, scanner portátil, acesso a bases de dados","c":"um orientador ou colega de departamento","r":"Limitados ou Estáveis"},{"n":"Engenheiro","f":["Mecânica","Eletrônica","Computação","Pesquisa","Observação","Investigação"],"v":"Leitura Estrutural. Identifica sem teste falhas estruturais evidentes em circunstâncias normais, e recebe mais dez em Mecânica e Eletrônica ao planejar uma improvisação com tempo.","l":"depende de medida. Estimativas sem instrumento sofrem menos dez, e laudos assinados criam responsabilidade técnica","e":"trena, multímetro, lanterna, notebook, caderno técnico","c":"um fornecedor ou um colega de obra","r":"Estáveis ou Confortáveis"},{"n":"Programador","f":["Computação","Eletrônica","Pesquisa","Investigação","Enganação","Observação"],"v":"Infraestrutura. Recebe mais dez em Computação ao trabalhar em sistema que conhece ou ajudou a construir, e reduz em um ponto o Progresso exigido por uma busca digital, com mínimo de um.","l":"pegada digital. Toda ação deixa registro, e o Mestre pode usar os acessos do personagem como prova contra ele","e":"notebook, roteador portátil, dispositivos de armazenamento, carregadores","c":"um colega de infraestrutura","r":"Estáveis"},{"n":"Advogado","f":["Persuasão","Pesquisa","Investigação","Empatia","Enganação","Intimidação"],"v":"Procedimento. Conhece direitos, prazos e formalidades. Recebe mais dez em Persuasão e Intimidação em contexto jurídico, pode interromper um interrogatório oficial que se prolongue além do razoável e, ao fim de um caso, pode reduzir um ponto de Atenção por meio de uma manobra legal.","l":"ética profissional. Forjar evidência ou obstruir a justiça pode custar a habilitação, e todo cliente tem direito ao sigilo que o personagem também deve","e":"pasta, tablet, procurações, cartões","c":"um servidor de cartório","r":"Estáveis ou Confortáveis"},{"n":"Religioso","f":["Religião","Ocultismo","Persuasão","Empatia","Pesquisa","Observação"],"v":"Comunidade. Pertence a uma comunidade que oferece abrigo, doações modestas e uma rede de simpatia. Conhece as liturgias da própria tradição e pode conduzir ritos que exijam um oficiante. Recebe mais dez em Controle diante de situações que a tradição trata, como luto, morte e sofrimento.","l":"hierarquia e dogma. Superiores podem exigir explicações, e agir contra o ensinamento de sua tradição tem custo social e interior","e":"texto sagrado, símbolos, objetos de culto","c":"um colega de ministério","r":"Limitados ou Estáveis"},{"n":"Militar","f":["Armas de Fogo","Corpo a Corpo","Defesa","Tática","Sobrevivência","Furtividade"],"v":"Disciplina de Campo. Uma vez por cena, recebe mais dez em um teste de Controle para manter posição sob fogo ou diante de medo, e seus planos de Tática concedem aos aliados mais cinco, além do bônus normal, em Iniciativa.","l":"reconhecível. Possui registro nas Forças, antigos companheiros e antigas ordens, e sua formação pode ser descoberta","e":"botas, mochila tática, faca de combate, kit de sobrevivência","c":"um antigo companheiro","r":"Estáveis"},{"n":"Criminoso","f":["Furtividade","Enganação","Corpo a Corpo","Armas de Fogo","Intimidação","Mecânica"],"v":"Mercado Paralelo. Pode adquirir equipamento incomum sem teste, e uma vez por caso equipamento raro, pagando um nível a mais de custo. Conhece rotas clandestinas e recebe mais dez em Furtividade para entrar e sair de locais urbanos.","l":"histórico. Possui antecedentes, inimigos e dívidas, e a Atenção inicial do personagem começa em um","e":"ferramentas de arrombamento, celular descartável, faca","c":"um receptador ou um informante","r":"Limitados ou Estáveis"},{"n":"Caçador Rural","f":["Sobrevivência","Armas de Fogo","Furtividade","Observação","Corpo a Corpo","Mecânica"],"v":"Terreno e Presa. Recebe mais dez em Sobrevivência e Observação em ambientes naturais e reconhece rastros de animais, o que lhe permite perceber, sem teste, quando um rastro não pertence a animal nenhum.","l":"estranho nos centros urbanos. Menos dez em testes sociais com autoridades e instituições de cidades grandes","e":"espingarda de caça, faca, binóculos, roupas de campo, lanterna","c":"um guarda-florestal ou um vizinho de sítio","r":"Limitados ou Estáveis"},{"n":"Mecânico","f":["Mecânica","Eletrônica","Direção","Observação","Corpo a Corpo","Sobrevivência"],"v":"Ouvido de Oficina. Diagnostica sem teste o problema de uma máquina ao ouvi-la, e recebe mais dez em Mecânica ao improvisar com sucata.","l":"depende de oficina e peças. Longe delas, perde o bônus, e sua reputação no bairro o torna fácil de encontrar","e":"caixa de ferramentas, lanterna, multímetro, cabos","c":"um dono de ferro-velho ou de autopeças","r":"Limitados ou Estáveis"},{"n":"Caminhoneiro","f":["Direção","Mecânica","Sobrevivência","Observação","Corpo a Corpo","Persuasão"],"v":"Estrada. Recebe mais dez em Direção em longas distâncias, conhece rotas e pontos de apoio por todo o país e pode localizar combustível, comida e abrigo sem teste em rotas que percorreu.","l":"horários. Cargas têm prazo, ausências prolongadas têm custo e um veículo grande é difícil de esconder","e":"veículo de carga ou carro, rádio, kit de ferramentas, garrafa térmica","c":"um radioamador ou um despachante","r":"Estáveis"},{"n":"Bombeiro","f":["Medicina","Sobrevivência","Mecânica","Direção","Defesa","Observação"],"v":"Prontidão. Recebe mais dez em testes de Resistência e Controle diante de fogo, fumaça, desabamento e emergências, e lê plantas, saídas e riscos de um edifício em poucos instantes, usando Tática para estruturas.","l":"compromisso público. Suas ações em emergências são registradas, e o dever de socorro pesa sobre suas escolhas","e":"lanterna tática, machado, kit de primeiros socorros, corda","c":"um colega de quartel","r":"Estáveis"},{"n":"Psicólogo","f":["Empatia","Persuasão","Medicina","Pesquisa","Observação","Investigação"],"v":"Escuta Clínica. Uma vez por sessão, em uma conversa tranquila de pelo menos uma hora, ajuda outro personagem a reduzir um ponto de Pressão, além do que o descanso e os vínculos já oferecem. Recebe mais dez em Empatia para identificar trauma.","l":"sigilo e distância. Não pode usar informação de paciente sem consequência, e não é capaz de tratar a própria Pressão com a mesma técnica","e":"caderno, gravador, livros","c":"um supervisor ou colega","r":"Estáveis ou Confortáveis"},{"n":"Arquivista","f":["Pesquisa","Investigação","Ocultismo","Observação","Computação","Persuasão"],"v":"Catálogo. Reduz em um ponto o Progresso exigido por pesquisas em acervos organizados, com mínimo de um, e recebe mais dez para avaliar a autenticidade de documentos.","l":"acesso. Depende dos acervos de sua instituição, e a rotina do cargo limita sua mobilidade","e":"luvas, lupa, caderno, scanner portátil","c":"um bibliotecário em outra cidade","r":"Limitados"},{"n":"Estudante","f":[],"v":"Aprendiz Veloz. O primeiro aumento de perícia de cada intervalo entre casos custa um ponto de experiência a menos, com mínimo de um, e o personagem tem mais tempo livre do que os demais, o que o Mestre deve respeitar.","l":"sem autoridade e sem dinheiro. Depende de família ou instituição, e responsabilidades acadêmicas competem com o caso","e":"notebook, mochila, carteira estudantil","c":"um professor","r":"Limitados"}];

function wErr(s){const w=wz;
 if(s===0){const l=15-sum(w.attrs);if(l!==0)return l>0?`Faltam ${l} ponto(s) de atributo para distribuir (total: 15).`:`Você passou ${-l} ponto(s) de atributo.`}
 if(s===1){if(!w.esp)return 'Escolha uma especialidade ou comece como amador.';
  if(w.esp==='Estudante'&&w.fsel.length!==6)return 'O Estudante escolhe seis perícias de formação.';
  if(sum(w.train)!==wTMax())return `Treinamento profissional: distribua exatamente ${wTMax()} pontos (agora: ${sum(w.train)}).`;
  if(Object.values(w.train).some(v=>v>10))return 'No máximo 10 pontos de treinamento em cada perícia de formação.'}
 if(s===2){const f=sum(w.free),p=wPool();if(f!==p)return `Distribua exatamente ${p} pontos de perícia (agora: ${f}).`;
  if(SK.some(([n])=>(+w.train[n]||0)+(+w.free[n]||0)>30))return 'Nenhuma perícia pode passar de 30 pontos na criação.';
  const fm=wForm();if(fm.length&&fm.reduce((a,n)=>a+(+w.free[n]||0),0)<20)return 'Pelo menos 20 dos pontos livres devem ir para perícias de formação.'}
 if(s===3&&!w.nome.trim())return 'Dê um nome ao personagem.';
 return ''}

 if(w.step===2){const fm=wForm(),sp=sum(w.free),fs=fm.reduce((a,n)=>a+(+w.free[n]||0),0);

 const draw=()=>{let b='';
  if(kind==='itens'){b=`<input id="cq" placeholder="Buscar…" value="${esc(q)}" style="margin:8px 0">`+ITENS.filter(x=>x.cat===tab&&x.n.toLowerCase().includes(q)).map(x=>`<details class="xc"><summary><span class="sp"><b>${esc(x.n)}</b><br><span class="mu">${[x.dano&&'Dano: '+x.dano,x.arm!=null&&'Armadura: '+x.arm,'Custo: '+x.custo,x.disp&&'Disp.: '+x.disp].filter(Boolean).map(esc).join(' · ')}${x.est?.length?' · (estimado: '+x.est.join(', ')+')':''}</span></span><button class="pr" data-i="${ITENS.indexOf(x)}">+</button></summary><div class="xb">${[x.alc&&'Alcance: '+x.alc,x.cap&&'Capacidade: '+x.cap,x.req&&'Requisito: '+x.req].filter(Boolean).map(esc).join(' · ')}<p>${esc(x.txt)}</p></div></details>`).join('')||'<p class="mu">Nada encontrado.</p>'}
  if(kind==='hab'){b=tab==='Novo talento'?`<p class="mu">O livro não traz uma lista fechada de talentos; crie o seu.</p>${F('fn','Nome do talento')}${F('fr','Pré-requisito')}${F('fc','Custo')}<textarea id="fd" placeholder="Descrição e efeito"></textarea><br><br><button class="pr" id="fadd">Adicionar</button>`:`<p class="mu">Exemplos de talentos citados no Cap. 4 do livro.</p><input id="cq" placeholder="Buscar…" value="${esc(q)}" style="margin:8px 0">`+TAL.filter(x=>x[0].toLowerCase().includes(q)).map((x,i)=>`<details class="xc"><summary><span class="sp"><b>${esc(x[0])}</b></span><button class="pr" data-t="${TAL.indexOf(x)}">+</button></summary><div class="xb">${esc(x[1])}</div></details>`).join('')}
  if(kind==='rit'){b=tab==='Novo ritual'?`<p class="mu">Modelo do Cap. 13: Complexidade, Alvo, Efeito, Meio, Componentes, Custo e Riscos.</p>${F('fn','Nome do ritual')}<div class="row"><input id="fcx" placeholder="Complexidade" style="flex:1"><input id="fal" placeholder="Alvo" style="flex:2"></div><br>${F('fef','Efeito')}${F('fme','Meio')}${F('fco','Componentes')}${F('fcu','Custo')}${F('fri','Riscos')}<textarea id="fd" placeholder="Descrição"></textarea><br><br><button class="pr" id="fadd">Adicionar</button>`:`<p class="mu">Sigilos e proteções do Cap. 13.</p>`+SIG.map((x,i)=>`<details class="xc"><summary><span class="sp"><b>${esc(x.n)}</b><br><span class="mu">${x.c?'Complexidade '+esc(x.c)+' · ':''}Alvo: ${esc(x.alvo)}</span></span><button class="pr" data-s="${i}">+</button></summary><div class="xb"><p>Efeito: ${esc(x.efeito)}. Meio: ${esc(x.meio)}.</p><p>${esc(x.d)}</p></div></details>`).join('')}
  o.innerHTML=`<div class="card mbox"><div class="row"><h2 class="sp" style="font-size:20px">${{itens:'Adicionar itens',hab:'Adicionar habilidades',rit:'Adicionar rituais'}[kind]}</h2><button class="x" data-x="1">✕</button></div><div class="tabs" style="margin-top:8px">${TB[kind].map(t=>`<a data-tab2="${t}" class="${t===tab?'on':''}">${t}</a>`).join('')}</div>${b}</div>`};
 o.onclick=e=>{const d=e.target.dataset,b=e.target.closest('button'),bd=b?.dataset||{};
  if(d.x||e.target===o)return o.remove();
  if(d.tab2){tab=d.tab2;q='';return draw()}
  if(bd.i!=null){e.preventDefault();const x=ITENS[+bd.i],cat=CATI[x.cat],est=x.est?.length?' (valores estimados: '+x.est.join(', ')+')':'';
   add('inventario',{n:x.n,cat,esp:1,qtd:1,dano:x.dano||'',desc:`${x.arm!=null?'Armadura '+x.arm+'. ':''}Custo ${x.custo}${x.disp?' · Disp. '+x.disp:''}${est}. ${x.txt}`});
   if(x.cat==='Armas'){c.weapons=c.weapons||[];c.weapons.push({name:x.n,skill:x.sub==='Armas brancas'?'Corpo a Corpo':'Armas de Fogo',dmg:x.dano,cat:'',tipo:'',esp:1,desc:x.txt+est});save(c);sheet($('#app'))}}
  if(bd.t!=null){e.preventDefault();const x=TAL[+bd.t];add('habilidades',{n:'Talento: '+x[0],desc:x[1],src:'Talento'})}
  if(bd.s!=null){e.preventDefault();const x=SIG[+bd.s];add('rituais',{n:x.n,custo:x.c?'Complexidade '+x.c:'',req:'Alvo: '+x.alvo,desc:`Efeito: ${x.efeito}\nMeio: ${x.meio}\n${x.d}`,src:'Sigilo'})}
  if(b?.id==='fadd'){const v=id=>($('#'+id,o)?.value||'').trim();if(!v('fn'))return alert('Dê um nome.');
   kind==='hab'?add('habilidades',{n:v('fn'),custo:v('fc'),req:v('fr'),desc:v('fd'),src:'Talento'}):add('rituais',{n:v('fn'),custo:v('fcx')?'Complexidade '+v('fcx'):v('fcu'),req:v('fal')?'Alvo: '+v('fal'):'',desc:[v('fef')&&'Efeito: '+v('fef'),v('fme')&&'Meio: '+v('fme'),v('fco')&&'Componentes: '+v('fco'),v('fcu')&&'Custo: '+v('fcu'),v('fri')&&'Riscos: '+v('fri'),v('fd')].filter(Boolean).join('\n'),src:'Ritual'});
   $('#fn',o).value=''}};
 o.oninput=e=>{if(e.target.id==='cq'){q=e.target.value.toLowerCase();const p=e.target.selectionStart;draw();const i=$('#cq',o);i.focus();i.setSelectionRange(p,p)}};
 draw()}

/* ---------- bestiário ---------- */
let tmode='best',tfam='',tlv='',bq='';
const modeTabs=()=>`<div class="tabs mtabs"><a data-m="best" class="${tmode==='best'?'on':''}">Bestiário</a><a data-m="mine" class="${tmode==='mine'?'on':''}">Minhas ameaças (${threats.length})</a></div>`;
const bestLines=x=>x.cat?[['Categoria',x.cat],['Atributos',x.attrs],['Perícias',x.per],['Defesa Passiva',x.dp],['Vida',x.vida],['Ataques',x.atq],['Capacidades',x.cap],['Vulnerabilidades',x.vul],['Âncora',x.anc],['Sinais',x.sin],['Exposição',x.exp],['Notas do Mestre',x.nota]].filter(l=>l[1]):[['Vida',x.vida],['Defesa Passiva',x.dp],['Característica',x.cap],['Fraqueza',x.vul],[' ',x.nota]].filter(l=>l[1]);
function threatsView(app){
 if(tmode==='mine')return myThreats(app);
 const fams=[...new Set(BEST.map(x=>x.fam))],l=BEST.filter(x=>x.n.toLowerCase().includes(bq)&&(!tfam||x.fam===tfam)&&(!tlv||x.nv===tlv));
 app.innerHTML=`${modeTabs()}<div class="row"><h2 class="sp">Bestiário: ${l.length}/${BEST.length}</h2><button class="pr" id="nv">Nova ameaça</button></div><div class="mu">Fichas do livro. Use + para copiar para a sua campanha e editar à vontade.</div>
 <div class="tabs" id="ft" style="margin-top:10px"><a data-f="" class="${tfam?'':'on'}">Todas</a>${fams.map(k=>`<a data-f="${esc(k)}" class="${tfam===k?'on':''}">${esc(k)}</a>`).join('')}</div>
 <div class="row"><input id="bq" placeholder="Buscar…" value="${esc(bq)}" style="flex:3"><select id="lv" style="flex:1"><option value="">Qualquer nível</option>${['Um','Dois','Três','Quatro','Cinco'].map(n=>`<option ${tlv===n?'selected':''}>${n}</option>`).join('')}</select></div><div id="g" style="margin-top:12px"></div>`;
 $('#g').innerHTML=l.map(x=>det('b'+BEST.indexOf(x),`<span class="sp"><b>${esc(x.n)}</b> <span class="mu">${esc(x.fam)} · Nível ${esc(x.nv)}${x.vida?' · Vida '+esc(x.vida):''}${x.dp?' · DP '+esc(x.dp):''}</span></span><button class="pr" data-ad="${BEST.indexOf(x)}" title="Adicionar à campanha">+</button>`,bestLines(x).map(([k,v])=>`<p><b class="rd">${esc(k)}</b> ${esc(v)}</p>`).join('')+(x.sub?`<p class="mu">${esc(x.sub)}</p>`:''))).join('')||'<p class="mu">Nenhuma criatura encontrada.</p>';
 $('.mtabs').onclick=e=>{if(e.target.dataset.m){tmode=e.target.dataset.m;threatsView(app)}};
 $('#ft').onclick=e=>{if(e.target.dataset.f!=null){tfam=e.target.dataset.f;threatsView(app)}};
 $('#lv').onchange=e=>{tlv=e.target.value;threatsView(app)};
 $('#bq').oninput=e=>{bq=e.target.value.toLowerCase();const p=e.target.selectionStart;threatsView(app);const i=$('#bq');i.focus();i.setSelectionRange(p,p)};
 $('#nv').onclick=()=>{tmode='mine';sb.from('threats').insert({campaign_id:camp.id,name:'Nova ameaça'}).then(r=>{r.error&&alert(r.error.message);threatsView(app)})};
 $('#g').onclick=async e=>{const b=e.target.closest('button');if(!b||b.dataset.ad==null)return;e.preventDefault();const x=BEST[+b.dataset.ad];
  const text=bestLines(x).map(([k,v])=>(k.trim()?k+': ':'')+v).join('\n');
  const r=await sb.from('threats').insert({campaign_id:camp.id,name:x.n,text,data:{cat:x.fam,nivel:x.nv}});r.error?alert(r.error.message):note('Adicionada à campanha: '+x.n)}}

/* ---------- sessão ---------- */
$('#out').onclick=()=>sb.auth.signOut();
async function setUser(s){
 if(s?.user){user=s.user;const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();prof=data||{name:'Jogador'}}
 else{user=null;camp=null;chan&&sb.removeChannel(chan)}
 render()}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>setUser(s),0)});
</script></body></html>
